[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlint"
version = "0.1.0"
description = "A linter for AI made financial models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nara" },
    { name = "Sowb" },
]

dependencies = [
    # Excel reading and recalculation (Section 5)
    "openpyxl>=3.1",
    "formulas>=1.3",
    # Data handling
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Anomaly detection / ML (Week 1)
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "pyod>=2.0",
    "torch>=2.3",
    # RAG (Week 5)
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Backend (Week 6)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    # Interface
    "streamlit>=1.36",
    # LLM providers (Section 5: Groq / Gemini default, Ollama offline fallback)
    "groq>=0.9",
    "google-generativeai>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
# Week 7 only, see Section 8
experiment = [
    "langgraph>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
